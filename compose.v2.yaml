services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-binance_radar}
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.v2}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-v2-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${V2_POSTGRES_PORT:-54329}:5432"
    networks:
      - radar-v2
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    profiles: ["docker-app"]
    build: .
    command: ["binance-monitor", "migrate"]
    env_file:
      - ${V2_ENV_FILE:-.env.v2}
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-binance_radar}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - radar-v2
    restart: "no"
    logging: *default-logging

  worker:
    profiles: ["docker-app"]
    build: .
    command: ["binance-monitor", "worker"]
    restart: unless-stopped
    env_file:
      - ${V2_ENV_FILE:-.env.v2}
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD}@127.0.0.1:${V2_POSTGRES_PORT:-54329}/${POSTGRES_DB:-binance_radar}?sslmode=disable"
      HTTP_PROXY_URL: "http://127.0.0.1:7890"
    depends_on:
      migrate:
        condition: service_completed_successfully
    network_mode: host
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    logging: *default-logging

  api:
    profiles: ["docker-app"]
    build: .
    command: ["binance-monitor", "api"]
    restart: unless-stopped
    env_file:
      - ${V2_ENV_FILE:-.env.v2}
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD}@127.0.0.1:${V2_POSTGRES_PORT:-54329}/${POSTGRES_DB:-binance_radar}?sslmode=disable"
      WEB_LISTEN_ADDR: "${V2_WEB_BIND_ADDRESS:-127.0.0.1}:${V2_WEB_PORT:-8080}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    network_mode: host
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://${V2_WEB_BIND_ADDRESS:-127.0.0.1}:${V2_WEB_PORT:-8080}/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 10s
    logging: *default-logging

networks:
  radar-v2:

volumes:
  postgres-v2-data:
